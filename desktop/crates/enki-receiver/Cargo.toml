[package]
name = "enki-receiver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Enki desktop receiver: Enki Link camera stream from the phone into a V4L2 loopback device"

[dependencies]
enki-protocol = { path = "../enki-protocol" }
enki-settings = { path = "../enki-settings" }
mdns-sd = "0.22.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "net", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"

[dev-dependencies]
enki-fakephone = { path = "../enki-fakephone" }
tempfile = "3.27.0"
